apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-rest-api-hpa
  namespace: devops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-rest-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60 # מוריד פודים תוך 60 שניות מסיום העומס לבדיקה ויזואלית מהירה
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15