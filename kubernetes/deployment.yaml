apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-rest-api
  namespace: devops
  labels:
    app: devops-rest-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-rest-api
  template:
    metadata:
      labels:
        app: devops-rest-api
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - devops-rest-api
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: rest-api
        image: ronkdev/devops-rest-api:v9.0.0
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: injected-file-volume
          mountPath: /app/injected
          readOnly: true
      volumes:
      - name: injected-file-volume
        configMap:
          name: injected-config
          optional: true